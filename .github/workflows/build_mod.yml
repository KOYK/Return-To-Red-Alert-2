name: Build RA2 Mod ZIP

on:
  push:
    paths:
      - 'Source/expandmd24/**'
      - 'Source/*.bat'
      - 'scripts/pack_mix.py'
      - '.github/workflows/build_mod.yml'
  workflow_dispatch:
  # This triggers the release logic when you create a tag (e.g., v1.0)
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    # Only run build if it's a release or manual trigger, or push to specific paths
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pack MIX File
        run: |
          python scripts/pack_mix.py Source/expandmd24 expandmd24.mix
          if (-not (Test-Path "expandmd24.mix")) { throw "MIX creation failed" }
          Write-Host "✓ MIX file created"
        shell: pwsh

      - name: Create ZIP Archive (Max Compression)
        run: |
          $tempFolder = "dist_temp"
          if (Test-Path $tempFolder) { Remove-Item -Recurse -Force $tempFolder }
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          Copy-Item "expandmd24.mix" -Destination $tempFolder

          Get-ChildItem -Path "Source" -Exclude "expandmd24" | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          Compress-Archive -Path "$tempFolder\*" -DestinationPath "RA2_Mod_Package.zip" -CompressionLevel Optimal -Force
          Write-Host "✓ ZIP archive created"
          Remove-Item -Recurse -Force $tempFolder

      - name: Upload Artifact (For Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: RA2-Mod-Package
          path: RA2_Mod_Package.zip
          retention-days: 30

  # NEW JOB: Attach to Release
  upload-release:
    needs: build
    runs-on: ubuntu-latest
    # Only run if the event is a published release
    if: github.event_name == 'release'
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: RA2-Mod-Package

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: RA2_Mod_Package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}