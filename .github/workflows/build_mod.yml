name: Build RA2 Mod ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download mix1 CLI Tool
        run: |
          # Download the latest release binary for Windows
          Invoke-WebRequest -Uri "https://github.com/cyberarm/mix1/releases/latest/download/mix1.exe" -OutFile "scripts/mix1.exe"
          if (-not (Test-Path "scripts/mix1.exe")) { throw "Failed to download mix1.exe" }
          Write-Host "✓ mix1.exe downloaded"
        shell: pwsh

      - name: Pack MIX File using mix1
        run: |
          # Syntax: mix1 pack <output_file> <input_folder>
          # Note: mix1 usually expects the folder to be passed as an argument
          .\scripts\mix1.exe pack expandmd24.mix Source\expandmd24
          
          if (-not (Test-Path "expandmd24.mix")) { throw "MIX creation failed" }
          Write-Host "✓ MIX file created successfully with mix1"
        shell: pwsh

      - name: Create ZIP Archive
        run: |
          $tempFolder = "dist_temp"
          if (Test-Path $tempFolder) { Remove-Item -Recurse -Force $tempFolder }
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          # 1. Copy the packed MIX file
          Copy-Item "expandmd24.mix" -Destination $tempFolder

          # 2. Copy ALL files from Source/ EXCEPT the expandmd24 folder
          Get-ChildItem -Path "Source" -Exclude "expandmd24" | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          # 3. Create ZIP
          Compress-Archive -Path "$tempFolder\*" -DestinationPath "RA2_Mod_Package.zip" -CompressionLevel Optimal -Force
          
          Write-Host "✓ ZIP archive created"
          Remove-Item -Recurse -Force $tempFolder

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: RA2_Mod_Package.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## RA2 Mod Package
            
            **Contents:**
            - `expandmd24.mix`: The packed mod archive (created with mix1).
            - `RA2_Mod_Package.zip`: Full package.
            
            **Installation:**
            1. Extract the ZIP.
            2. Place `expandmd24.mix` in your Red Alert 2/Yuri's Revenge folder.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}