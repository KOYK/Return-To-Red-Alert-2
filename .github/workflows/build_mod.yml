name: Build YR_TO_RA2 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
        shell: pwsh

      - name: Generate Changelog
        id: changelog
        run: |
          $$prevTag = git describe --tags --abbrev=0 HEAD^ 2>$$null
          if ($LASTEXITCODE -ne 0) { $prevTag = "" }
          
          if ($prevTag) {
            $commits = git log --pretty=format:"* %s" $prevTag..HEAD
          } else {
            $commits = git log --pretty=format:"* %s" HEAD
          }
          
          $changelogHeader = "## Changelog for ${{ steps.version.outputs.TAG }}"
          
          # Write to a temp file to avoid YAML escaping issues
          Set-Content -Path "changelog_temp.txt" -Value "$$changelogHeader`n$$commits"
          
          # Read it back and set output
          $content = Get-Content "changelog_temp.txt" -Raw
          echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          echo "$content" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Update README
        run: |
          $readmePath = "YR_TO_RA2_readme.txt"
          $existingContent = ""
          
          if (Test-Path $readmePath) {
            $existingContent = Get-Content $readmePath -Raw
          }
          
          $newHeader = @"
========================================
YR_TO_RA2 Mod - Version ${{ steps.version.outputs.TAG }}
Released: $(Get-Date -Format "yyyy-MM-dd")
========================================

${{ steps.changelog.outputs.CHANGELOG }}

----------------------------------------
"@
          
          $$finalContent = "$$newHeader`n$existingContent"
          Set-Content -Path $readmePath -Value $finalContent -Encoding UTF8
          Write-Host "✓ README updated"
        shell: pwsh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Clone ccmixar Repository
        run: |
          git clone https://github.com/askeladdk/ccmixar.git ccmixar_source
          Write-Host "✓ ccmixar source cloned"
        shell: pwsh

      - name: Build ccmixar
        run: |
          cd ccmixar_source
          go build -o ../scripts/ccmixar.exe .
          if (-not (Test-Path "../scripts/ccmixar.exe")) { throw "Build failed" }
          Write-Host "✓ ccmixar.exe built successfully"
        shell: pwsh

      - name: Pack MIX File using ccmixar
        run: |
          .\scripts\ccmixar.exe pack -dir Source\expandmd24 -mix expandmd24.mix -game ra2
          if (-not (Test-Path "expandmd24.mix")) { throw "MIX creation failed" }
          Write-Host "✓ MIX file created"
        shell: pwsh

      - name: Create Version Marker
        run: |
          Set-Content -Path "YR_TO_RA2_VERSION.txt" -Value "${{ steps.version.outputs.TAG }}" -Encoding UTF8
          Write-Host "✓ Version marker created"
        shell: pwsh

      - name: Create Portable ZIP
        run: |
          $tempFolder = "dist_temp"
          if (Test-Path $tempFolder) { Remove-Item -Recurse -Force $tempFolder }
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          Copy-Item "expandmd24.mix" -Destination $tempFolder
          Copy-Item "YR_TO_RA2_readme.txt" -Destination $tempFolder
          Copy-Item "YR_TO_RA2_VERSION.txt" -Destination $tempFolder

          Get-ChildItem -Path "Source" -Exclude "expandmd24" | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          Compress-Archive -Path "$$tempFolder\*" -DestinationPath "YR_TO_RA2_$${{ steps.version.outputs.VERSION }}.zip" -CompressionLevel Optimal -Force
          Write-Host "✓ Portable ZIP created"
          Remove-Item -Recurse -Force $tempFolder
        shell: pwsh

      - name: Create Installer Script
        run: |
          $$version = "$${{ steps.version.outputs.VERSION }}"
          $$tag = "$${{ steps.version.outputs.TAG }}"
          
          $issContent = @"
[Setup]
AppName=YR_TO_RA2 Mod
AppVersion=$version
AppPublisher=KOYK
DefaultDirName={autopf}\Westwood\Red Alert 2
DefaultGroupName=YR_TO_RA2 Mod
OutputDir=dist
OutputBaseFilename=YR_TO_RA2_${version}_Installer
Compression=lzma2
SolidCompression=yes
WizardStyle=modern

[Files]
Source: "expandmd24.mix"; DestDir: "{app}"; Flags: ignoreversion
Source: "YR_TO_RA2_readme.txt"; DestDir: "{app}"; Flags: ignoreversion
Source: "YR_TO_RA2_VERSION.txt"; DestDir: "{app}"; Flags: ignoreversion
Source: "Source\*.bat"; DestDir: "{app}"; Flags: ignoreversion
Source: "Source\*.ini"; DestDir: "{app}"; Flags: ignoreversion
Source: "Source\*.cfg"; DestDir: "{app}"; Flags: ignoreversion

[Code]
procedure CurStepChanged(CurStep: TSetupStep);
var
  OldVersion: String;
  MixExists: Boolean;
begin
  if CurStep = ssPostInstall then
  begin
    MixExists := FileExists(ExpandConstant('{app}\expandmd24.mix'));
    if MixExists then
    begin
      DelFile(ExpandConstant('{app}\expandmd24.mix'));
      MsgBox('Old expandmd24.mix file removed.', mbInformation, MB_OK);
    end;
    
    if FileExists(ExpandConstant('{app}\YR_TO_RA2_VERSION.txt')) then
    begin
      LoadStringFromFile(ExpandConstant('{app}\YR_TO_RA2_VERSION.txt'), OldVersion);
      MsgBox('Previous version: ' + OldVersion, mbInformation, MB_OK);
    end;
  end;
end;

[Icons]
Name: "{group}\Run Mod"; Filename: "{app}\RunAres.bat"
Name: "{group}\{cm:UninstallProgram,YR_TO_RA2 Mod}"; Filename: "{uninstallexe}"
"@
          
          Set-Content -Path "installer.iss" -Value $issContent -Encoding UTF8
          Write-Host "✓ Installer script created"
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Build Installer
        run: |
          iscc.exe installer.iss
          if (-not (Test-Path "dist\YR_TO_RA2_${{ steps.version.outputs.VERSION }}_Installer.exe")) { 
            throw "Installer build failed" 
          }
          Move-Item "dist\YR_TO_RA2_${{ steps.version.outputs.VERSION }}_Installer.exe" "." -Force
          Write-Host "✓ Installer created"
        shell: pwsh

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YR_TO_RA2_${{ steps.version.outputs.VERSION }}.zip
            YR_TO_RA2_${{ steps.version.outputs.VERSION }}_Installer.exe
          tag_name: ${{ github.ref_name }}
          name: YR_TO_RA2 ${{ steps.version.outputs.TAG }}
          body: |
            ## YR_TO_RA2 Mod - ${{ steps.version.outputs.TAG }}
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            **Downloads:**
            - [Portable ZIP](#) - For manual installation
            - [Installer EXE](#) - For automatic installation (removes old version)
            
            **Installation:**
            1. Run the installer OR extract the ZIP
            2. Place files in your Red Alert 2/Yuri's Revenge folder
            3. Run `RunAres.bat` to launch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}