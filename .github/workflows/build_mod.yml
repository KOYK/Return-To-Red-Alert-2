name: Build RA2 Mod ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Clone ccmixar Repository
        run: |
          git clone https://github.com/askeladdk/ccmixar.git ccmixar_source
          Write-Host "✓ ccmixar source cloned"
        shell: pwsh

      - name: Build ccmixar
        run: |
          cd ccmixar_source
          go build -o ../scripts/ccmixar.exe .
          if (-not (Test-Path "../scripts/ccmixar.exe")) { throw "Build failed" }
          Write-Host "✓ ccmixar.exe built successfully"
        shell: pwsh

      - name: Pack MIX File using ccmixar
        run: |
          .\scripts\ccmixar.exe pack Source\expandmd24 expandmd24.mix
          
          if (-not (Test-Path "expandmd24.mix")) { throw "MIX creation failed" }
          Write-Host "✓ MIX file created successfully with ccmixar"
        shell: pwsh

      - name: Create ZIP Archive
        run: |
          $tempFolder = "dist_temp"
          if (Test-Path $tempFolder) { Remove-Item -Recurse -Force $tempFolder }
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          Copy-Item "expandmd24.mix" -Destination $tempFolder

          Get-ChildItem -Path "Source" -Exclude "expandmd24" | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          Compress-Archive -Path "$tempFolder\*" -DestinationPath "RA2_Mod_Package.zip" -CompressionLevel Optimal -Force
          
          Write-Host "✓ ZIP archive created"
          Remove-Item -Recurse -Force $tempFolder

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: RA2_Mod_Package.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## RA2 Mod Package
            
            **Contents:**
            - `expandmd24.mix`: The packed mod archive (created with ccmixar).
            - `RA2_Mod_Package.zip`: Full package.
            
            **Installation:**
            1. Extract the ZIP.
            2. Place `expandmd24.mix` in your Red Alert 2/Yuri's Revenge folder.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}