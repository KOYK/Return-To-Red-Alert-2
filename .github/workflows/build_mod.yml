name: Build YR_TO_RA2 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version (Bash)
        run: |
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        shell: bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Clone ccmixar Repository
        run: |
          git clone https://github.com/askeladdk/ccmixar.git ccmixar_source
          Write-Host '✓ ccmixar source cloned'
        shell: pwsh

      - name: Build ccmixar
        run: |
          cd ccmixar_source
          go build -o ../scripts/ccmixar.exe .
          if (-not (Test-Path '../scripts/ccmixar.exe')) { throw 'Build failed' }
          Write-Host '✓ ccmixar.exe built successfully'
        shell: pwsh

      - name: Pack MIX File using ccmixar
        run: |
          .\scripts\ccmixar.exe pack -dir Source\expandmd24 -mix expandmd24.mix -game ra2
          if (-not (Test-Path 'expandmd24.mix')) { throw 'MIX creation failed' }
          Write-Host '✓ MIX file created'
        shell: pwsh

      - name: Create Version Marker
        run: |
          Set-Content -Path 'YR_TO_RA2_VERSION.txt' -Value $env:TAG_NAME -Encoding UTF8
          Write-Host "✓ Version marker created: $env:TAG_NAME"
        shell: pwsh

      - name: Create ZIP Archive
        run: |
          $tempFolder = 'dist_temp'
          if (Test-Path $tempFolder) { Remove-Item -Recurse -Force $tempFolder }
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          Copy-Item 'expandmd24.mix' -Destination $tempFolder
          Copy-Item 'YR_TO_RA2_VERSION.txt' -Destination $tempFolder

          Get-ChildItem -Path 'Source' -Exclude 'expandmd24' | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          # USE CONCATENATION, NOT INTERPOLATION
          $prefix = 'YR_TO_RA2_Package_'
          $suffix = '.zip'
          $zipName = $prefix + $env:TAG_NAME + $suffix
          
          Compress-Archive -Path "$tempFolder\*" -DestinationPath $zipName -CompressionLevel Optimal -Force
          
          Write-Host "✓ ZIP created: $zipName"
          Remove-Item -Recurse -Force $tempFolder
        shell: pwsh

      - name: Create Installer Script
        run: |
          $tag = $env:TAG_NAME
          $version = $env:VERSION
          $installerName = 'YR_TO_RA2_Installer_' + $tag

          # Use SINGLE QUOTES for paths in Inno Setup (Valid syntax, avoids double-quote issues)
          $issLines = @(
            '[Setup]',
            'AppName=YR_TO_RA2 Mod',
            "AppVersion=$version",
            'AppPublisher=YR TO RA2 Mod Authors',
            'DefaultDirName={autopf}\Games\Command & Conquer\Command & Conquer Red Alert II',
            'DefaultGroupName=Command & Conquer\YR TO RA2 Mod',
            'OutputDir=dist',
            "OutputBaseFilename=$installerName",
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            '',
            '[Files]',
            "Source: 'expandmd24.mix'; DestDir: '{app}'; Flags: ignoreversion",
            "Source: 'YR_TO_RA2_VERSION.txt'; DestDir: '{app}'; Flags: ignoreversion",
            "Source: 'Source\*.bat'; DestDir: '{app}'; Flags: ignoreversion",
            "Source: 'Source\*.ini'; DestDir: '{app}'; Flags: ignoreversion",
            "Source: 'Source\*.cfg'; DestDir: '{app}'; Flags: ignoreversion",
            '',
            '[Code]',
            'procedure CurStepChanged(CurStep: TSetupStep);',
            'var',
            '  MixExists: Boolean;',
            'begin',
            '  if CurStep = ssPostInstall then',
            '  begin',
            "    MixExists := FileExists(ExpandConstant('{app}\expandmd24.mix'));",
            '    if MixExists then',
            '    begin',
            "      DelFile(ExpandConstant('{app}\expandmd24.mix'));",
            "      MsgBox('Old expandmd24.mix file removed.', mbInformation, MB_OK);",
            '    end;',
            '  end;',
            'end;',
            '',
            '[Icons]',
            "Name: '{group}\Run Mod'; Filename: '{app}\RunAres.bat'",
            "Name: '{group}\{cm:UninstallProgram,YR TO RA2 Mod}'; Filename: '{uninstallexe}'"
          )
          
          $issContent = $issLines -join "`n"
          Set-Content -Path 'installer.iss' -Value $issContent -Encoding UTF8
          Write-Host "✓ Installer script created: $installerName"
          Get-Content 'installer.iss'
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Build Installer
        run: |
          $tag = $env:TAG_NAME
          $installerName = 'YR_TO_RA2_Installer_' + $tag + '.exe'
          
          iscc.exe installer.iss
          
          $expectedFile = 'dist\' + $installerName
          if (-not (Test-Path $expectedFile)) { 
            throw "Installer build failed. Expected: $expectedFile" 
          }
          Move-Item $expectedFile '.' -Force
          Write-Host "✓ Installer created: $installerName"
        shell: pwsh

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YR_TO_RA2_Package_${{ github.ref_name }}.zip
            YR_TO_RA2_Installer_${{ github.ref_name }}.exe
          tag_name: ${{ github.ref_name }}
          name: YR_TO_RA2 ${{ github.ref_name }}
          body: |
            ## YR_TO_RA2 Mod - ${{ github.ref_name }}
            
            **Downloads:**
            - [Portable ZIP](#)
            - [Installer EXE](#)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}