name: Build and Release RA2 Mod

on:
  push:
    tags:
      - 'v*'  # Triggers on any tag starting with 'v' (e.g., v1.0, v1.1)

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pack MIX File
        run: |
          python scripts/pack_mix.py Source/expandmd24 expandmd24.mix
          if (-not (Test-Path "expandmd24.mix")) { throw "MIX creation failed" }
          Write-Host "✓ MIX file created"
        shell: pwsh

      - name: Create ZIP Archive
        run: |
          $tempFolder = "dist_temp"
          if (Test-Path $tempFolder) { Remove-Item -Recurse -Force $tempFolder }
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          Copy-Item "expandmd24.mix" -Destination $tempFolder

          Get-ChildItem -Path "Source" -Exclude "expandmd24" | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          Compress-Archive -Path "$tempFolder\*" -DestinationPath "RA2_Mod_Package.zip" -CompressionLevel Optimal -Force
          Write-Host "✓ ZIP archive created"
          Remove-Item -Recurse -Force $tempFolder

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: RA2_Mod_Package.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## RA2 Mod Package
            
            This release contains:
            - `expandmd24.mix`: The packed mod file.
            - `RA2_Mod_Package.zip`: The full package with all files.
            
            **Installation:**
            1. Extract the ZIP.
            2. Run the installer or place the .mix file in your game directory.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}