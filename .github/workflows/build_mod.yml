name: Build RA2 Mod ZIP

on:
  push:
    paths:
      - 'Source/expandmd24/**'
      - 'Source/*.bat'
      - 'scripts/pack_mix.py'
      - '.github/workflows/build_mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pack MIX File
        run: |
          python scripts/pack_mix.py Source/expandmd24 expandmd24.mix
          if (-not (Test-Path "expandmd24.mix")) { throw "MIX creation failed" }
          Write-Host "✓ MIX file created"
        shell: pwsh

      - name: Create ZIP Archive (Max Compression)
        run: |
          # Create a temporary folder to gather files
          $tempFolder = "dist_temp"
          
          # Clean up any existing temp folder first
          if (Test-Path $tempFolder) {
            Remove-Item -Recurse -Force $tempFolder
          }
          
          # Create fresh temp folder
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          # 1. Copy the packed MIX file
          Copy-Item "expandmd24.mix" -Destination $tempFolder

          # 2. Copy ALL files from Source/ EXCEPT the expandmd24 folder
          # Get all items (files and folders) except expandmd24
          Get-ChildItem -Path "Source" -Exclude "expandmd24" | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          # 3. Create ZIP with Maximum Compression
          Compress-Archive -Path "$tempFolder\*" -DestinationPath "RA2_Mod_Package.zip" -CompressionLevel Optimal -Force

          Write-Host "✓ ZIP archive created with max compression"

          # Cleanup temp folder
          Remove-Item -Recurse -Force $tempFolder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RA2-Mod-Package
          path: RA2_Mod_Package.zip
          retention-days: 30