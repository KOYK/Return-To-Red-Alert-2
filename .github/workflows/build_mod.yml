name: Build Return To Red Alert 2 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version (Bash)
        run: |
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        shell: bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Clone ccmixar Repository
        run: |
          git clone https://github.com/askeladdk/ccmixar.git ccmixar_source
          Write-Host '✓ ccmixar source cloned'
        shell: pwsh

      - name: Build ccmixar
        run: |
          cd ccmixar_source
          go build -o ../scripts/ccmixar.exe .
          if (-not (Test-Path '../scripts/ccmixar.exe')) { throw 'Build failed' }
          Write-Host '✓ ccmixar.exe built successfully'
        shell: pwsh

      - name: Pack MIX File using ccmixar
        run: |
          .\scripts\ccmixar.exe pack -dir Source\expandmd24 -mix expandmd24.mix -game ra2
          if (-not (Test-Path 'expandmd24.mix')) { throw 'MIX creation failed' }
          Write-Host '✓ MIX file created'
        shell: pwsh

      - name: Create Version Marker
        run: |
          Set-Content -Path 'Return_To_Red_Alert_2_V.txt' -Value $env:TAG_NAME -Encoding UTF8
          Write-Host "✓ Version marker created: $env:TAG_NAME"
        shell: pwsh

      - name: Create ZIP Archive
        run: |
          $tempFolder = 'dist_temp'
          if (Test-Path $tempFolder) { Remove-Item -Recurse -Force $tempFolder }
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          Copy-Item 'expandmd24.mix' -Destination $tempFolder
          Copy-Item 'Return_To_Red_Alert_2_V.txt' -Destination $tempFolder

          Get-ChildItem -Path 'Source' -Exclude 'expandmd24' | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          $prefix = 'Return To Red Alert 2 Portable '
          $suffix = '.zip'
          $zipName = $prefix + $env:TAG_NAME + $suffix
          
          Compress-Archive -Path "$tempFolder\*" -DestinationPath $zipName -CompressionLevel Optimal -Force
          
          Write-Host "✓ ZIP created: $zipName"
          Remove-Item -Recurse -Force $tempFolder
        shell: pwsh

      - name: Create Installer Script
        run: |
          $tag = $env:TAG_NAME
          $version = $env:VERSION
          $installerName = 'Return To Red Alert 2 Installer ' + $tag

          $lines = @(
            "[Setup]",
            "AppName=Return To Red Alert 2 Mod",
            "AppVersion=$version",
            "AppPublisher=Return To Red Alert 2 Mod Authors",
            "DefaultDirName=C:\Games\Command and Conquer\Command and Conquer Red Alert II",
            "DefaultGroupName=Command and Conquer\YR TO RA2 Mod",
            "OutputDir=dist",
            "OutputBaseFilename=$installerName",
            "Compression=lzma2",
            "SolidCompression=yes",
            "WizardStyle=modern",
            "CreateAppDir=yes",
            "",
            "[Files]",
            "Source: expandmd24.mix; DestDir: {app}; Flags: ignoreversion",
            "Source: Return_To_Red_Alert_2_V.txt; DestDir: {app}; Flags: ignoreversion",
            "Source: Source\*.bat; DestDir: {app}; Flags: ignoreversion",
            "Source: Source\*.dll; DestDir: {app}; Flags: ignoreversion",
            "Source: Source\*.exe; DestDir: {app}; Flags: ignoreversion",
            "Source: Source\*.inj; DestDir: {app}; Flags: ignoreversion",
            "Source: Source\*.mix; DestDir: {app}; Flags: ignoreversion",
            "Source: Source\*.txt; DestDir: {app}; Flags: ignoreversion",
            "Source: Source\RA2.ico; DestDir: {app}; Flags: ignoreversion",
            "",
            "[Icons]",
            'Name: {group}\YR to RA2 Mod; Filename: {app}\Syringe.exe; Parameters: """gamemd.exe"" %COMMAND%"; IconFilename: {app}\RA2.ico',
            'Name: {userdesktop}\YR to RA2 Mod; Filename: {app}\Syringe.exe; Parameters: """gamemd.exe"" %COMMAND%"; IconFilename: {app}\RA2.ico; Tasks: desktopshortcut',
            "",
            "[Tasks]",
            'Name: desktopshortcut; Description: "Create a &desktop shortcut"; GroupDescription: "Additional Options:"; Flags: unchecked'
          )

          $lines -join "`n" | Set-Content -Path 'installer.iss' -Encoding UTF8
          
          Write-Host "✓ Installer script created: $installerName"
          Get-Content 'installer.iss'
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Build Installer
        run: |
          $tag = $env:TAG_NAME
          $installerName = 'Return To Red Alert 2 Installer ' + $tag + '.exe'
          
          iscc.exe installer.iss
          
          $expectedFile = 'dist\' + $installerName
          if (-not (Test-Path $expectedFile)) { 
            throw "Installer build failed. Expected: $expectedFile" 
          }
          Move-Item $expectedFile '.' -Force
          Write-Host "✓ Installer created: $installerName"
        shell: pwsh

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Return To Red Alert 2 Portable ${{ github.ref_name }}.zip
            Return To Red Alert 2 Installer ${{ github.ref_name }}.exe
          tag_name: ${{ github.ref_name }}
          name: Return To Red Alert 2 ${{ github.ref_name }}
          body: |
            ## Return To Red Alert 2 Mod - ${{ github.ref_name }}
            Download the mod using either the portable ZIP or installer EXE below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}