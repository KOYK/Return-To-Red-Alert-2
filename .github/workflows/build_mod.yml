name: Build YR_TO_RA2 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              tag="${{ github.event.inputs.version }}"
            else
              tag="v1.0"
            fi
          else
            tag="${{ github.ref_name }}"
          fi
          
          version="${tag#v}"
          
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "TAG=$tag" >> $GITHUB_OUTPUT
          
          echo "Detected Tag: $tag"
          echo "Detected Version: $version"

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$prev_tag" ]; then
            commits=$$(git log --pretty=format:"* %s" "$$prev_tag"..HEAD)
          else
            commits=$(git log --pretty=format:"* %s" HEAD)
          fi
          
          changelog_header="## Changelog for ${{ github.ref_name }}"
          changelog_full="$$changelog_header"$$'\n'"$commits"
          
          echo "$changelog_full" > changelog_temp.txt
          content=$(cat changelog_temp.txt)
          
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update README
        shell: bash
        run: |
          readme_path="YR_TO_RA2_readme.txt"
          existing_content=""
          
          if [ -f "$readme_path" ]; then
            existing_content=$$(cat "$$readme_path")
          fi
          
          date_str=$(date +%Y-%m-%d)
          tag="${{ steps.version.outputs.TAG }}"
          changelog="${{ steps.changelog.outputs.CHANGELOG }}"
          
          # Use a Here-Document to write the file safely
          # The 'EOF' is quoted so variables are NOT expanded by bash immediately, 
          # but we use $() for commands and $var for our variables which ARE expanded.
          # Actually, for GitHub vars, we need unquoted EOF to expand ${{ }}
          
          cat > "$readme_path" << EOF
========================================
YR_TO_RA2 Mod - Version $tag
Released: $date_str
========================================

$changelog

----------------------------------------
$existing_content
EOF
          
          echo "✓ README updated"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Clone ccmixar Repository
        shell: bash
        run: |
          git clone https://github.com/askeladdk/ccmixar.git ccmixar_source
          echo "✓ ccmixar source cloned"

      - name: Build ccmixar
        shell: bash
        run: |
          cd ccmixar_source
          go build -o ../scripts/ccmixar.exe .
          if [ ! -f "../scripts/ccmixar.exe" ]; then
            echo "Build failed"
            exit 1
          fi
          echo "✓ ccmixar.exe built successfully"

      - name: Pack MIX File using ccmixar
        shell: bash
        run: |
          ./scripts/ccmixar.exe pack -dir Source/expandmd24 -mix expandmd24.mix -game ra2
          if [ ! -f "expandmd24.mix" ]; then
            echo "MIX creation failed"
            exit 1
          fi
          echo "✓ MIX file created"

      - name: Create Version Marker
        shell: bash
        run: |
          echo "${{ steps.version.outputs.TAG }}" > YR_TO_RA2_VERSION.txt
          echo "✓ Version marker created"

      - name: Create Portable ZIP
        shell: bash
        run: |
          temp_folder="dist_temp"
          rm -rf "$temp_folder"
          mkdir -p "$temp_folder"

          cp expandmd24.mix "$temp_folder/"
          cp YR_TO_RA2_readme.txt "$temp_folder/"
          cp YR_TO_RA2_VERSION.txt "$temp_folder/"

          # Copy Source contents excluding expandmd24
          cp -r Source/* "$temp_folder/" --exclude="expandmd24" 2>/dev/null || true
          # Handle nested directories if needed, but -r usually covers it
          # If specific files are needed:
          find Source -mindepth 1 -maxdepth 1 -type d ! -name "expandmd24" -exec cp -r {} "$temp_folder/" \;
          find Source -mindepth 1 -maxdepth 1 -type f -exec cp {} "$temp_folder/" \;

          version="${{ steps.version.outputs.VERSION }}"
          zip_name="YR_TO_RA2_${version}.zip"
          
          # Create ZIP
          powershell -Command "Compress-Archive -Path '$$temp_folder/*' -DestinationPath '$$zip_name' -CompressionLevel Optimal -Force"
          
          echo "✓ Portable ZIP created"
          rm -rf "$temp_folder"

      - name: Create Installer Script
        shell: bash
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          tag="${{ steps.version.outputs.TAG }}"
          
          cat > installer.iss << 'ISS_EOF'
[Setup]
AppName=YR_TO_RA2 Mod
AppVersion=VERSION_PLACEHOLDER
AppPublisher=KOYK
DefaultDirName={autopf}\Westwood\Red Alert 2
DefaultGroupName=YR_TO_RA2 Mod
OutputDir=dist
OutputBaseFilename=YR_TO_RA2_VERSION_PLACEHOLDER_Installer
Compression=lzma2
SolidCompression=yes
WizardStyle=modern

[Files]
Source: "expandmd24.mix"; DestDir: "{app}"; Flags: ignoreversion
Source: "YR_TO_RA2_readme.txt"; DestDir: "{app}"; Flags: ignoreversion
Source: "YR_TO_RA2_VERSION.txt"; DestDir: "{app}"; Flags: ignoreversion
Source: "Source\*.bat"; DestDir: "{app}"; Flags: ignoreversion
Source: "Source\*.ini"; DestDir: "{app}"; Flags: ignoreversion
Source: "Source\*.cfg"; DestDir: "{app}"; Flags: ignoreversion

[Code]
procedure CurStepChanged(CurStep: TSetupStep);
var
  OldVersion: String;
  MixExists: Boolean;
begin
  if CurStep = ssPostInstall then
  begin
    MixExists := FileExists(ExpandConstant('{app}\expandmd24.mix'));
    if MixExists then
    begin
      DelFile(ExpandConstant('{app}\expandmd24.mix'));
      MsgBox('Old expandmd24.mix file removed.', mbInformation, MB_OK);
    end;
    
    if FileExists(ExpandConstant('{app}\YR_TO_RA2_VERSION.txt')) then
    begin
      LoadStringFromFile(ExpandConstant('{app}\YR_TO_RA2_VERSION.txt'), OldVersion);
      MsgBox('Previous version: ' + OldVersion, mbInformation, MB_OK);
    end;
  end;
end;

[Icons]
Name: "{group}\Run Mod"; Filename: "{app}\RunAres.bat"
Name: "{group}\{cm:UninstallProgram,YR_TO_RA2 Mod}"; Filename: "{uninstallexe}"
ISS_EOF

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/$version/g" installer.iss
          echo "✓ Installer script created"

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: bash

      - name: Build Installer
        shell: bash
        run: |
          iscc.exe installer.iss
          version="${{ steps.version.outputs.VERSION }}"
          if [ ! -f "dist/YR_TO_RA2_${version}_Installer.exe" ]; then
            echo "Installer build failed"
            exit 1
          fi
          mv "dist/YR_TO_RA2_${version}_Installer.exe" "."
          echo "✓ Installer created"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YR_TO_RA2_${{ steps.version.outputs.VERSION }}.zip
            YR_TO_RA2_${{ steps.version.outputs.VERSION }}_Installer.exe
          tag_name: ${{ github.ref_name }}
          name: YR_TO_RA2 ${{ steps.version.outputs.TAG }}
          body: |
            ## YR_TO_RA2 Mod - ${{ steps.version.outputs.TAG }}
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            **Downloads:**
            - [Portable ZIP](#)
            - [Installer EXE](#)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}