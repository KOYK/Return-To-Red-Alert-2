name: Build RA2 Mod ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pack MIX File (RA2 Compatible)
        run: |
          python scripts/pack_mix.py Source/expandmd24 expandmd24.mix
          if (-not (Test-Path "expandmd24.mix")) { throw "MIX creation failed" }
          Write-Host "✓ MIX file created successfully"
        shell: pwsh

      - name: Create ZIP Archive
        run: |
          $tempFolder = "dist_temp"
          if (Test-Path $tempFolder) { Remove-Item -Recurse -Force $tempFolder }
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          # 1. Copy the packed MIX file
          Copy-Item "expandmd24.mix" -Destination $tempFolder

          # 2. Copy ALL files from Source/ EXCEPT the expandmd24 folder
          Get-ChildItem -Path "Source" -Exclude "expandmd24" | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempFolder -Recurse -Force
          }

          # 3. Create ZIP with Maximum Compression
          Compress-Archive -Path "$tempFolder\*" -DestinationPath "RA2_Mod_Package.zip" -CompressionLevel Optimal -Force
          
          Write-Host "✓ ZIP archive created"
          Remove-Item -Recurse -Force $tempFolder

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: RA2_Mod_Package.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## RA2 Mod Package
            
            **Contents:**
            - `expandmd24.mix`: The packed mod archive.
            - `RA2_Mod_Package.zip`: Full package (MIX + other files).
            
            **Installation:**
            1. Extract the ZIP.
            2. Place `expandmd24.mix` in your Red Alert 2/Yuri's Revenge folder.
            3. Run `RunAres.bat` or launch the game.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}