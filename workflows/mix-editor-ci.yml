name: Build MIX Editor Snap

# Trigger on pushes to main, PRs, or manually
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Install Snapcraft in GitHub runner
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      # 3️⃣ Build the Snap
      - name: Build MIX Editor Snap
        uses: snapcore/action-build@v1
        id: build

      # 4️⃣ Test the Snap installation on the runner
      - name: Test Snap installation
        run: |
          sudo snap install --dangerous *.snap
          mix-editor --version || echo "Check your executable name"

      # 5️⃣ Upload the built Snap as an artifact
      - name: Upload Snap artifact
        uses: actions/upload-artifact@v3
        with:
          name: mix-editor-snap
          path: "*.snap"

      # 6️⃣ Optional: Publish to Snap Store (requires STORE_LOGIN secret)
      # Uncomment this section if you want to auto-publish
      # - name: Publish Snap to Snap Store
      #   uses: snapcore/action-publish@v1
      #   with:
      #     store_login: ${{ secrets.STORE_LOGIN }}
      #     snap: ${{ steps.build.outputs.snap }}
      #     release: edge